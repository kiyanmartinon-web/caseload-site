# Netlify publishes this folder as-is. No build step.
[build]
  publish = "."

# Subscription back end (Stripe). Each file serves one /api/... route.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# "Can I…?" is the homepage now; old links (emails, bookmarks, saved answers) still work.
[[redirects]]
  from = "/can-i.html"
  to = "/"
  status = 301
  force = true

# Keep the database setup notes and repo files off the public site.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true

# Function source code is not a web page.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 301
  force = true

# Claude Code skill files are for development, not visitors.
[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
